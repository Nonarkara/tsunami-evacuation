name: Validate pilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: node scripts/check-contrast.mjs
      - run: python3 -m venv .venv-smoke
      - run: .venv-smoke/bin/pip install playwright==1.60.0
      - run: .venv-smoke/bin/python -m playwright install --with-deps chromium
      - run: .venv-smoke/bin/python scripts/release-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke
          path: output/release-smoke.json
